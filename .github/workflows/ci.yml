name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python & Workshop Package
        run: |
          uv python install 3.12
          uv venv
          uv pip install -e ".[riemann,dev]"
      - name: Run Unit & Live LSL Integration Suite
        run: uv run pytest -v
      - name: Run Exercise 00 Setup Self-Test
        run: uv run python exercises/00_check_setup.py --self-test
