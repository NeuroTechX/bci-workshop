[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntx-bci-workshop"
version = "2.0.0"
description = "NeuroTechX Hands-On Brain-Computer Interface Workshop Kit for Chapters and Student Clubs"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [
  { name = "Raymundo Cassani" },
  { name = "Hubert Banville" },
  { name = "NeuroTechX Community" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pylsl>=1.16.2",
]

[project.optional-dependencies]
mne-lsl = ["mne>=1.6", "mne-lsl>=1.7"]
riemann = ["pyriemann>=0.6"]
hardware = ["muselsl>=2.3", "bleak>=0.21", "brainflow>=5.12", "pyserial>=3.5"]
moabb = ["moabb>=1.1", "pyriemann>=0.6", "mne>=1.6"]
timeflux = ["timeflux>=0.15", "timeflux-dsp>=0.5", "timeflux-ui>=0.6"]
dev = ["pytest>=7.4", "ruff>=0.5"]
all = [
  "mne>=1.6",
  "mne-lsl>=1.7",
  "pyriemann>=0.6",
  "brainflow>=5.12",
  "pytest>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bci_workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
